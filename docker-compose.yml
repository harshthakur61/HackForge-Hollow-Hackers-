services:
  postgres:
    image: postgres:16-alpine
    container_name: hackforge-postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: hackforge-engine
    restart: always
    environment:
      - DATABASE_URL=postgresql://juggler:juggler@postgres:5432/treasury
      - POOL_USD=100000000.0
      - ACCRUAL=overnight_1d
      - POLICY_MODE=zero_overdraft
      - MODEL_FOR_POLICY=B1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  bootstrap:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: hackforge-bootstrap
    profiles:
      - bootstrap
    environment:
      - DATABASE_URL=postgresql://juggler:juggler@postgres:5432/treasury
      - POOL_USD=100000000.0
      - ACCRUAL=overnight_1d
      - POLICY_MODE=zero_overdraft
      - MODEL_FOR_POLICY=B1
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "engine.scripts.bootstrap"]

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: hackforge-server
    restart: always
    environment:
      - DATABASE_URL=postgresql://juggler:juggler@postgres:5432/treasury
      - ENGINE_URL=http://engine:8000
      - SERVER_PORT=4000
      - TICK_MS=1000
    ports:
      - "4000:4000"
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: hackforge-web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
